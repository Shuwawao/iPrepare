name: Build & Deploy iPrepare APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Deployment
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/iPrepare.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPrepare-apk
          path: app/build/outputs/apk/debug/iPrepare.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "iPrepare v1.0.0 — Disaster Preparedness App"
          draft: false
          prerelease: false
          make_latest: true
          files: app/build/outputs/apk/debug/iPrepare.apk
          body: |
            ## 📱 iPrepare Mobile Application (Android)
            
            Welcome to the official release of **iPrepare**, a Philippine disaster preparedness and risk-reduction mobile guide.

            ### 🚀 Direct Download Instructions for Your Phone:
            1. Download the attached **`iPrepare.apk`** below directly to your Android phone.
            2. Open the downloaded file.
            3. If prompted, allow **"Install unknown apps"** for your browser or file manager.
            4. Tap **Install** and launch **iPrepare**!

            ---

            ### ✨ What's in this Release:
            - **Modern Design System:** Philippine disaster safety palette (Teal, Terracotta Earthquake, Water Azure Flood, Emergency Red Fire, Storm Cyan Typhoon).
            - **Disaster Learning Modules:** Detailed PDF guides & interactive lessons.
            - **Offline-Ready Readiness Checklists:** Interactive supply checklists with real-time percentage tracking.
            - **Knowledge Quizzes:** Practice tests with answer animations and profile score tracking.
            - **One-Tap Emergency Hotlines:** Direct dialers for 911, NDRRMC, PNP, BFP, and DOH.
            - **Community Advisories & Admin Console:** Real-time updates feed and bulletin broadcaster.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
